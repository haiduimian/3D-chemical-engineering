<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edge 右键手势规避示例（中键平移 + 右键自定义菜单）</title>
<style>
  /* ============ 样式 ============ */
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #14181d; color: #dfe6ee; }
  #stage {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background:
      radial-gradient(circle at 30% 30%, #1e2733, #14181d 70%);
    user-select: none; -webkit-user-select: none;   /* 防止拖拽时选中文本 */
    touch-action: none;                              /* 防止触摸手势被浏览器接管 */
  }
  #box {
    position: absolute; left: 50%; top: 50%; width: 160px; height: 100px;
    margin: -50px 0 0 -80px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #2e6e5e, #185fa5); border: 1px solid #7fb8e6;
    border-radius: 12px; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  #bar {
    position: absolute; left: 12px; top: 12px; padding: 8px 14px;
    background: rgba(20,24,29,.9); border: 1px solid #2c343e; border-radius: 8px; font-size: 12px;
  }
  #menu {
    position: absolute; display: none; min-width: 140px; z-index: 99;
    background: #20262d; border: 1px solid #3a4550; border-radius: 8px; padding: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.6);
  }
  #menu div { padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #menu div:hover { background: #185fa5; }
  #hint {
    position: absolute; left: 12px; bottom: 12px; max-width: 640px; padding: 10px 14px;
    background: rgba(240,180,41,.08); border: 1px solid rgba(240,180,41,.5);
    color: #ffd479; border-radius: 8px; font-size: 12px; line-height: 1.7;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="box">中键拖拽平移我</div>
  <div id="bar">🖱 左键：无操作 · 中键：拖拽平移 · 右键：自定义菜单</div>
  <div id="menu">
    <div data-act="info">查看设备信息</div>
    <div data-act="focus">聚焦设备</div>
    <div data-act="reset">复位视角</div>
  </div>
  <div id="hint"></div>
</div>

<script>
/* ============================================================
 * 背景：Microsoft Edge 内置「鼠标手势」功能 —— 按住鼠标右键快速
 * 滑动会触发浏览器导航（↑后退 / ↓前进 / 其他方向刷新/关闭标签等）。
 * 关键事实：
 *   1) 该手势由【浏览器进程】在页面之外处理，不属于 DOM 事件，
 *      网页内任何 preventDefault（mousedown / pointerdown / contextmenu）
 *      都无法阻止它 —— 这是 Edge 与 Chrome 的本质差异（Chrome 无内置
 *      手势，需扩展实现，扩展内可以拦截）。
 *   2) contextmenu 的 preventDefault 只能阻止【右键菜单】，拦不住手势。
 *
 * 因此可靠方案 =「规避」而非「对抗」：
 *   A. 应用交互层：拖拽类操作改走【中键】；右键仅用于「点击」类
 *      自定义交互（点击不会触发手势，手势要求按住后滑动）。
 *   B. 用户层：引导在 Edge 设置 → 鼠标手势 中关闭（edge://settings/mouseGesture）。
 *   C. 兜底：监听 popstate/pageshow，若手势误触发「后退」则自动恢复
 *      （前进不可靠拦截，仅供缓解）。
 * ============================================================ */
(function () {
  const stage = document.getElementById('stage');
  const box = document.getElementById('box');
  const menu = document.getElementById('menu');
  const hint = document.getElementById('hint');

  /* ---------- 0. 环境检测 ---------- */
  const isEdge = /Edg\//.test(navigator.userAgent);
  hint.innerHTML = isEdge
    ? '⚠ 检测到 Microsoft Edge：其内置「鼠标手势」会劫持右键拖拽（触发前进/返回）。' +
      '本示例已改用 <b>中键拖拽平移</b> 规避；如需保留右键拖拽，请在 ' +
      '<b>edge://settings/mouseGesture</b> 中关闭「鼠标手势」后刷新。'
    : '当前浏览器无内置右键手势，右键拖拽可正常使用（Chrome 等）。';

  /* ---------- 1. 阻止右键默认行为（菜单） ---------- */
  // contextmenu：阻止浏览器右键菜单（对 Edge/Chrome 均有效；但拦不住 Edge 手势）
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- 2. 右键「点击」= 应用自定义菜单（点击不触发手势） ---------- */
  let downBtn = -1, downX = 0, downY = 0;
  stage.addEventListener('pointerdown', function (e) {
    downBtn = e.button; downX = e.clientX; downY = e.clientY;
    // 阻止右键按下带来的焦点/选区副作用（对菜单有效）
    if (e.button === 2) e.preventDefault();
  });
  stage.addEventListener('pointerup', function (e) {
    // 右键且几乎未移动 = 点击 → 弹出自定义菜单（代替浏览器菜单）
    if (e.button === 2 && Math.abs(e.clientX - downX) < 5 && Math.abs(e.clientY - downY) < 5) {
      menu.style.display = 'block';
      menu.style.left = e.clientX + 'px';
      menu.style.top = e.clientY + 'px';
    }
  });
  menu.addEventListener('pointerdown', function (e) { e.stopPropagation(); e.preventDefault(); });
  menu.addEventListener('pointerup', function (e) {
    const act = e.target.getAttribute('data-act');
    if (act === 'reset') box.style.left = '50%', box.style.top = '50%', box.style.margin = '-50px 0 0 -80px';
    else if (act === 'focus') box.style.borderColor = '#ffd479';
    else if (act === 'info') box.textContent = 'V-101 储罐';
    menu.style.display = 'none';
  });
  // 点击他处关闭菜单
  stage.addEventListener('pointerdown', function () { menu.style.display = 'none'; });

  /* ---------- 3. 中键拖拽平移（规避 Edge 右键手势） ---------- */
  let dragging = false, offsetX = 0, offsetY = 0;
  stage.addEventListener('pointerdown', function (e) {
    if (e.button === 1) {              // 中键
      e.preventDefault();
      dragging = true;
      const r = box.getBoundingClientRect();
      offsetX = e.clientX - r.left; offsetY = e.clientY - r.top;
    }
  });
  stage.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    box.style.left = (e.clientX - offsetX) + 'px';
    box.style.top = (e.clientY - offsetY) + 'px';
    box.style.margin = '0';
  });
  stage.addEventListener('pointerup', function (e) { if (e.button === 1) dragging = false; });
  stage.addEventListener('pointerleave', function () { dragging = false; });

  /* ---------- 4. 兜底：手势误触发「后退」时自动恢复（缓解） ---------- */
  // 进入时压入哨兵历史项；若 Edge 手势触发 back，popstate 会触发并可由 history.forward() 拉回。
  // 注意：若用户本就该后退（从外部进入），此兜底会误挡 —— 仅在确有需要时启用。
  if (isEdge) {
    try {
      history.pushState({ guard: true }, '');
      window.addEventListener('popstate', function (e) {
        if (e.state && e.state.guard) return;   // 前进了
        history.forward();                        // 后退被手势触发 → 拉回
      });
    } catch (err) { /* 某些受限环境会抛 SecurityError，忽略 */ }
  }
})();
</script>
</body>
</html>
